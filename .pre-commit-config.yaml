repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [ --fix ]
  - repo: local
    hooks:
      - id: honesty-guard
        name: Honesty Guard
        entry: python scripts/honesty_guard.py
        language: system
        pass_filenames: false
        always_run: true
