name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  guard:
    runs-on: ubuntu-latest
    # gitleaks-action calls the PR-commits API to scan the diff, which the
    # default GITHUB_TOKEN doesn't have read access to unless granted here.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # gitleaks-action needs the full commit history to diff the range it
      # scans; the default shallow clone (fetch-depth: 1) makes its `git log`
      # fail with "unknown revision" the moment that range spans more than
      # the single fetched commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Honesty Guard
        run: python scripts/honesty_guard.py
      # if: always() - without this, a failing Honesty Guard step (even a
      # false positive) makes GitHub Actions skip every later step in this
      # job by default, including Gitleaks. That's exactly how a real
      # secret leak in backend/.env.example and apps/web/.env.example
      # reached main undetected: the guard failed first on an unrelated
      # false positive, so gitleaks never ran to catch it. These two scans
      # must be independent - one's failure must never suppress the other.
      - name: Gitleaks
        if: always()
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        # ruff/mypy/pytest/pytest-asyncio all live in the "dev" optional
        # group in pyproject.toml -- plain `uv sync --frozen` only installs
        # the base dependency list, so every step below was failing with
        # "Failed to spawn: ruff" (and would have failed the same way on
        # mypy/pytest right after) before this.
        run: cd backend && uv sync --frozen --all-extras

      - name: Run Ruff
        run: cd backend && uv run ruff check .
        
      - name: Run Mypy
        run: cd backend && uv run mypy app/
        
      - name: Run Pytest Unit
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:password@localhost:5432/testdb"
          ENVIRONMENT: test
        run: cd backend && uv run pytest tests/unit/
        
      - name: Migrations & DB tests
        env:
          # +psycopg (v3) isn't installed by this project -- only
          # psycopg2-binary is a declared dependency (see pyproject.toml).
          MIGRATIONS_DATABASE_URL: "postgresql+psycopg2://postgres:password@localhost:5432/testdb"
          ENVIRONMENT: test
        run: |
          cd backend
          # The nq_api role no longer needs to be created here: the
          # rls.sql migration payload now creates it itself if missing.
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
          # tests/integration/db/ has never existed in this repo; the two
          # DB-backed integration tests actually live directly under
          # tests/integration/.
          uv run pytest tests/integration/test_repository.py tests/integration/test_schema.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Typecheck
        # `pnpm tsc --noEmit` from the workspace root has no tsconfig.json
        # to find (each app/package has its own), so tsc printed its own
        # --help text and exited 1 instead of type-checking anything.
        run: pnpm --filter @neuroquant/web run type-check
      - name: Test Symbols
        run: pnpm --filter @neuroquant/web exec vitest run src/lib/symbols.test.ts
      - name: Test Safety Guard Rails
        run: pnpm --filter @neuroquant/web exec vitest run src/tests/safety.test.ts
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4

      # ── Python / backend ───────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install backend dependencies
        run: cd backend && uv sync --frozen --all-extras

      # ── Node / frontend ────────────────────────────────────────────────
      - uses: pnpm/action-setup@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install

      # ── Playwright browsers ────────────────────────────────────────────
      - name: Install Playwright browsers
        run: pnpm --filter @neuroquant/web exec playwright install --with-deps chromium

      # ── Run E2E ────────────────────────────────────────────────────────
      - name: Run Playwright E2E tests
        env:
          # Backend starts against SQLite so no Postgres service is needed
          DATABASE_URL: "sqlite+aiosqlite:///./e2e_test.db"
          ENVIRONMENT: test
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
          NEXT_PUBLIC_WS_URL: "ws://localhost:8000/ws"
          # Supabase is not needed — auth flows are mocked with page.route()
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          NEXT_PUBLIC_RAZORPAY_KEY_ID: "rzp_test_placeholder"
        run: pnpm --filter @neuroquant/web exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
