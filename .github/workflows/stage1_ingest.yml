name: Stage 1 Data Ingestion Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  ingest:
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_SSL_REQUIRED: True
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas_market_calendars yfinance

      - name: Run Universe Ingestion
        working-directory: ./backend
        run: python -m app.ingestion.universe

      - name: Run Calendar Ingestion
        working-directory: ./backend
        run: python -m app.ingestion.calendar

      - name: Run Historical Ingestion
        working-directory: ./backend
        run: python -c "from app.ingestion.historical import ingest_historical; import asyncio; asyncio.run(ingest_historical('AAPL'))"
