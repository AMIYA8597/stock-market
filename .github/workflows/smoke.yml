name: Post-deploy smoke

# Runs automatically after the CI workflow completes on main (i.e., after a
# successful Vercel + Cloud Run deploy), and can also be triggered manually
# with an optional target URL override.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_url:
        description: "Frontend URL to smoke-test (default: production)"
        required: false
        default: "https://neuroquant-sm.vercel.app"

jobs:
  smoke:
    # Only run if the triggering CI workflow succeeded (or if manually dispatched)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm --filter @neuroquant/web exec playwright install --with-deps chromium

      # If smoke credentials are not yet configured, emit a notice and skip
      # gracefully instead of failing the workflow.
      - name: Check smoke credentials
        id: check_creds
        run: |
          if [ -z "$SMOKE_TEST_EMAIL" ] || [ -z "$SMOKE_TEST_PASSWORD" ]; then
            echo "::notice::SMOKE_TEST_EMAIL or SMOKE_TEST_PASSWORD not set. Skipping smoke tests."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}

      - name: Run smoke tests
        if: steps.check_creds.outputs.skip == 'false'
        env:
          SMOKE_TARGET_URL: ${{ github.event.inputs.target_url || 'https://neuroquant-sm.vercel.app' }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: pnpm --filter @neuroquant/web exec playwright test --config playwright.smoke.config.ts

      - name: Upload smoke report
        if: always() && steps.check_creds.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: apps/web/playwright-report/
          retention-days: 7
