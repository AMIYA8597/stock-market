name: Deploy Backend → Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

# Cancel in-progress deployments when a newer push arrives
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: tradebit-396406
  REGION: asia-south1
  SERVICE: neuroquant-api
  IMAGE: gcr.io/tradebit-396406/neuroquant-api

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build & Push Docker image via Cloud Build
        run: |
          # Submit build asynchronously to avoid log-streaming permission issues.
          # gcloud builds submit --tag only accepts one tag; we use :latest and
          # also tag it with the SHA using a separate `gcloud` step after the build.
          BUILD_ID=$(gcloud builds submit backend/ \
            --tag ${{ env.IMAGE }}:latest \
            --project ${{ env.PROJECT_ID }} \
            --quiet \
            --async \
            --format='value(id)')
          echo "Cloud Build ID: $BUILD_ID"

          # Poll until the build completes (up to 15 minutes)
          for i in $(seq 1 60); do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project ${{ env.PROJECT_ID }} \
              --format='value(status)' 2>/dev/null || echo "UNKNOWN")
            echo "Build status: $STATUS (poll $i/60)"
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "✅ Build succeeded"
              break
            elif [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "❌ Build failed with status: $STATUS"
              exit 1
            fi
            sleep 15
          done

          if [ "$STATUS" != "SUCCESS" ]; then
            echo "❌ Build did not complete within 15 minutes (last status: $STATUS)"
            exit 1
          fi

      - name: Deploy to Cloud Run
        run: |
          # Write env vars from GitHub Secret to a temp file, if provided.
          # Secret CLOUDRUN_ENV_YAML should contain KEY: "VALUE" lines (Cloud Run YAML format).
          # Example:
          #   DATABASE_URL: "postgresql+asyncpg://user:pass@host/db"
          #   SUPABASE_URL: "https://xxx.supabase.co"
          #   ENVIRONMENT: "production"
          ENV_FILE_FLAG=""
          if [ -n "${{ secrets.CLOUDRUN_ENV_YAML }}" ]; then
            echo '${{ secrets.CLOUDRUN_ENV_YAML }}' > /tmp/cloudrun-env.yaml
            ENV_FILE_FLAG="--env-vars-file /tmp/cloudrun-env.yaml"
          fi
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:latest \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 7860 \
            $ENV_FILE_FLAG \
            --quiet

      - name: Print Service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --format "value(status.url)")
          echo "✅ Deployed: $URL"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
