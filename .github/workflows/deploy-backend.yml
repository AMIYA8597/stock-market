name: Deploy Backend → Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

# Cancel in-progress deployments when a newer push arrives
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: tradebit-396406
  REGION: asia-south1
  SERVICE: neuroquant-api
  IMAGE: gcr.io/tradebit-396406/neuroquant-api

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build & Push Docker image via Cloud Build
        run: |
          BUILD_ID=$(gcloud builds submit backend/ \
            --tag ${{ env.IMAGE }}:latest \
            --project ${{ env.PROJECT_ID }} \
            --quiet \
            --async \
            --format='value(id)')
          echo "Cloud Build ID: $BUILD_ID"

          for i in $(seq 1 60); do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project ${{ env.PROJECT_ID }} \
              --format='value(status)' 2>/dev/null || echo "UNKNOWN")
            echo "Build status: $STATUS (poll $i/60)"
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "✅ Build succeeded"
              break
            elif [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "❌ Build failed with status: $STATUS"
              exit 1
            fi
            sleep 15
          done

          if [ "$STATUS" != "SUCCESS" ]; then
            echo "❌ Build did not complete within 15 minutes (last status: $STATUS)"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run Migrations Against Production DB
        # Run alembic upgrade head against Supabase before deploying new image
        # Uses session-mode pooler (port 5432) which supports DDL/migrations
        env:
          DATABASE_URL: ${{ secrets.CLOUDRUN_DATABASE_URL || secrets.CLOUDRUN_MIGRATIONS_DATABASE_URL }}
          MIGRATIONS_DATABASE_URL: ${{ secrets.CLOUDRUN_MIGRATIONS_DATABASE_URL }}
          REDIS_URL: ""
          ENVIRONMENT: production
        run: |
          cd backend && uv sync --frozen --python 3.12 --quiet
          echo "Running alembic upgrade head against production DB..."
          uv run alembic upgrade head
          echo "✅ Migrations complete"


      - name: Write Cloud Run env vars file
        # Pull each secret into a step-level env var, then write a YAML file
        # using Python for reliable quoting of special characters.
        # Using individual env vars (not CLOUDRUN_ENV_YAML) avoids YAML-in-bash
        # quoting issues that caused the previous approach to fail silently.
        env:
          CR_DATABASE_URL: ${{ secrets.CLOUDRUN_DATABASE_URL }}
          CR_MIGRATIONS_DATABASE_URL: ${{ secrets.CLOUDRUN_MIGRATIONS_DATABASE_URL }}
          CR_REDIS_URL: ${{ secrets.CLOUDRUN_REDIS_URL }}
          CR_SUPABASE_URL: ${{ secrets.CLOUDRUN_SUPABASE_URL }}
          CR_SUPABASE_SECRET_KEY: ${{ secrets.CLOUDRUN_SUPABASE_SECRET_KEY }}
          CR_SUPABASE_ANON_KEY: ${{ secrets.CLOUDRUN_SUPABASE_ANON_KEY }}
          CR_RAZORPAY_KEY_ID: ${{ secrets.CLOUDRUN_RAZORPAY_KEY_ID }}
          CR_RAZORPAY_KEY_SECRET: ${{ secrets.CLOUDRUN_RAZORPAY_KEY_SECRET }}
          CR_SUPABASE_JWT_SECRET: ${{ secrets.CLOUDRUN_SUPABASE_JWT_SECRET }}
          CR_SENDGRID_API_KEY: ${{ secrets.CLOUDRUN_SENDGRID_API_KEY }}
          CR_SENDGRID_FROM_EMAIL: ${{ secrets.CLOUDRUN_SENDGRID_FROM_EMAIL }}
          CR_UPSTOX_ENABLED: ${{ secrets.CLOUDRUN_UPSTOX_ENABLED }}
          CR_LIVE_DATA_PROVIDER: ${{ secrets.CLOUDRUN_LIVE_DATA_PROVIDER }}
          CR_UPSTOX_ANALYTICS_TOKEN: ${{ secrets.CLOUDRUN_UPSTOX_ANALYTICS_TOKEN || secrets.UPSTOX_ANALYTICS_TOKEN }}
          CR_UPSTOX_CLIENT_ID: ${{ secrets.CLOUDRUN_UPSTOX_CLIENT_ID || secrets.UPSTOX_CLIENT_ID }}
          CR_UPSTOX_CLIENT_SECRET: ${{ secrets.CLOUDRUN_UPSTOX_CLIENT_SECRET || secrets.UPSTOX_CLIENT_SECRET }}
          CR_UPSTOX_REDIRECT_URI: ${{ secrets.CLOUDRUN_UPSTOX_REDIRECT_URI || secrets.UPSTOX_REDIRECT_URI }}
          CR_GROQ_API_KEY: ${{ secrets.CLOUDRUN_GROQ_API_KEY || secrets.GROQ_API_KEY }}
          CR_GEMINI_API_KEY: ${{ secrets.CLOUDRUN_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os, sys

          redis_url = os.environ.get("CR_REDIS_URL", "").strip()
          if redis_url:
              r_lower = redis_url.lower()
              if (
                  "changeme" in r_lower
                  or "your_" in r_lower
                  or "replace_me" in r_lower
                  or r_lower.startswith("redis://localhost")
                  or r_lower.startswith("redis://127.0.0.1")
              ):
                  print(f"⚠️  Ignoring insecure/local CR_REDIS_URL in Cloud Run: {r_lower}")
                  redis_url = ""

          env_vars = {
              "DATABASE_URL":            os.environ.get("CR_DATABASE_URL", ""),
              "MIGRATIONS_DATABASE_URL": os.environ.get("CR_MIGRATIONS_DATABASE_URL", ""),
              "REDIS_URL":                redis_url,
              "SUPABASE_URL":            os.environ.get("CR_SUPABASE_URL", ""),
              "SUPABASE_SECRET_KEY":     os.environ.get("CR_SUPABASE_SECRET_KEY", ""),
              "SUPABASE_ANON_KEY":       os.environ.get("CR_SUPABASE_ANON_KEY", ""),
              "RAZORPAY_KEY_ID":         os.environ.get("CR_RAZORPAY_KEY_ID", ""),
              "RAZORPAY_KEY_SECRET":     os.environ.get("CR_RAZORPAY_KEY_SECRET", ""),
              "SUPABASE_JWT_SECRET":     os.environ.get("CR_SUPABASE_JWT_SECRET", ""),
              "SENDGRID_API_KEY":        os.environ.get("CR_SENDGRID_API_KEY", ""),
              "SENDGRID_FROM_EMAIL":     os.environ.get("CR_SENDGRID_FROM_EMAIL", "") or "neuroquant990@gmail.com",
              "ALERT_EMAIL_ENABLED":     "true" if os.environ.get("CR_SENDGRID_API_KEY") else "false",
              "ENVIRONMENT":             "production",
              "BACKEND_CORS_ORIGINS":    "https://neuroquant-sm.vercel.app,http://localhost:3000",
              "UPSTOX_ENABLED":          os.environ.get("CR_UPSTOX_ENABLED") or "false",
              "LIVE_DATA_PROVIDER":      os.environ.get("CR_LIVE_DATA_PROVIDER") or "yfinance",
              "UPSTOX_ANALYTICS_TOKEN":  os.environ.get("CR_UPSTOX_ANALYTICS_TOKEN", ""),
              "UPSTOX_CLIENT_ID":        os.environ.get("CR_UPSTOX_CLIENT_ID", ""),
              "UPSTOX_CLIENT_SECRET":    os.environ.get("CR_UPSTOX_CLIENT_SECRET", ""),
              "UPSTOX_REDIRECT_URI":     os.environ.get("CR_UPSTOX_REDIRECT_URI") or "https://neuroquant-api-6g57r5groa-el.a.run.app/api/v1/auth/upstox/callback",
              "GROQ_API_KEY":            os.environ.get("CR_GROQ_API_KEY", ""),
              "GEMINI_API_KEY":          os.environ.get("CR_GEMINI_API_KEY", ""),
          }

          # Check if any critical vars are missing.  SUPABASE_JWT_SECRET is
          # optional because current Supabase projects use JWKS (asymmetric)
          # verification by default; the HS256 fallback is only for legacy
          # projects.
          optional_vars = {
              "ENVIRONMENT",
              "BACKEND_CORS_ORIGINS",
              "SUPABASE_JWT_SECRET",
              "REDIS_URL",
              "SENDGRID_API_KEY",
              "SENDGRID_FROM_EMAIL",
              "ALERT_EMAIL_ENABLED",
              "MIGRATIONS_DATABASE_URL",
              "UPSTOX_ENABLED",
              "LIVE_DATA_PROVIDER",
              "UPSTOX_ANALYTICS_TOKEN",
              "UPSTOX_CLIENT_ID",
              "UPSTOX_CLIENT_SECRET",
              "UPSTOX_REDIRECT_URI",
              "GROQ_API_KEY",
              "GEMINI_API_KEY",
          }
          missing = [k for k, v in env_vars.items() if not v and k not in optional_vars]
          if missing:
              print(f"⚠️  Missing critical secrets (will not set env vars): {missing}")
              sys.exit(0)
          missing_optional = [k for k, v in env_vars.items() if not v and k in optional_vars - {"ENVIRONMENT", "BACKEND_CORS_ORIGINS"}]
          if missing_optional:
              print(f"ℹ️  Optional secrets not set (JWKS is primary): {missing_optional}")

          # Write Cloud Run YAML env vars file
          lines = []
          for k, v in env_vars.items():
              if v == "" and k in optional_vars:
                  continue
              safe_v = v.replace('\\', '\\\\').replace('"', '\\"')
              lines.append(f'{k}: "{safe_v}"')

          with open("/tmp/cloudrun-env.yaml", "w") as f:
              f.write("\n".join(lines) + "\n")

          print("✅ Wrote /tmp/cloudrun-env.yaml with keys:", list(env_vars.keys()))
          PYEOF

      - name: Deploy to Cloud Run
        run: |
          ENV_FILE_FLAG=""
          if [ -f /tmp/cloudrun-env.yaml ]; then
            ENV_FILE_FLAG="--env-vars-file /tmp/cloudrun-env.yaml"
            echo "📋 Using env vars file"
          else
            echo "⚠️  No env vars file — Cloud Run will use existing service config"
          fi

          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:latest \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 7860 \
            --timeout 3600s \
            --concurrency 80 \
            --min-instances 1 \
            --max-instances 10 \
            --cpu 2 \
            --memory 2Gi \
            --session-affinity \
            $ENV_FILE_FLAG \
            --quiet

      - name: Print Service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --format "value(status.url)")
          echo "✅ Deployed: $URL"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
