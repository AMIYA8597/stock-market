apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantedge-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: quantedge-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: POSTGRES_URL
          value: "postgresql+asyncpg://neuroquant:neuroquant@postgres:5432/neuroquant"
        - name: REDIS_URL
          value: "redis://redis:6379/0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantedge-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: quantedge-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://api.quantedge.internal/v1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        ports:
        - containerPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: timescale/timescaledb:latest-pg16-oss
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: neuroquant
        - name: POSTGRES_PASSWORD
          value: neuroquant
        - name: POSTGRES_DB
          value: neuroquant

